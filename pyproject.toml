[project]
name = "trovex"
dynamic = ["version"]
description = "Trovex — token-efficient routing for agent-generated .md docs. MCP + Web UI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "TsukumoHQ"}]
license = "AGPL-3.0-or-later"
keywords = ["mcp", "llm", "context", "coding-agents", "embeddings", "rag", "documentation", "token-efficiency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastembed>=0.4",
    # Direct import: the int8 query embedder (perf A) fetches the quantized ONNX +
    # tokenizer via hf_hub_download. Already pulled transitively by fastembed; pinned
    # here because trovex now imports it directly.
    "huggingface-hub>=0.24",
    # Static-embedding fallback (perf D, task ad2ad98e): potion-retrieval-32M
    # (Model2Vec, MIT). A token→vector lookup + mean-pool — no NN forward pass, so
    # ~0.06 ms p50 / 1.6 ms p95 at 16 concurrent. Used ONLY on the shed/degraded
    # boot path (never the normal dense path); deps are light (numpy + tokenizers +
    # safetensors, already transitive via fastembed). Imported lazily in the
    # embedder so a missing install degrades to the empty pack, not a crash.
    "model2vec>=0.9",
    "sqlite-vec>=0.1.6",
    "mcp>=1.2,<2",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "typer>=0.13",
    "rich>=13.9",
    "python-multipart>=0.0.31",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "openai>=1.50",
    "mistune>=3.3.0",
    "pygments>=2.18",
    "slowapi>=0.1.10",
    "starlette>=1.3.1",
    "watchdog>=6.0",
    "tiktoken>=0.8",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Parallel test runner: the full suite is ~300s serial and overran the gate's
    # 900s slot cap under fleet load (ticket 38c5c8a0). -n auto drops it to ~130s.
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "ruff>=0.8",
    # so the usearch equivalence test (test_usearch_index.py) actually runs in
    # CI instead of skipping — same package as the `usearch` extra below.
    "usearch>=2.16",
]
# Per-partition HNSW escape hatch (see capacity.py) — offline, no network at
# query time. Optional in production: absent means every partition stays on
# sqlite-vec brute force unconditionally, never a hard failure.
usearch = [
    "usearch>=2.16",
]

# PEP 735 default group: uv auto-syncs [dependency-groups].dev on `uv run` and
# `uv sync` (no --extra needed), so a bare `uv run pytest -q` always has pytest
# AND pytest-xdist. Without this, 38c5c8a0's addopts `-n 3 --dist worksteal`
# exit-4 on any venv synced before xdist landed (the [dev] EXTRA is not synced
# by `uv run`), which rejected r5's gate validate. The [project.optional-
# dependencies].dev extra above is kept verbatim for CI that calls
# `uv sync --extra dev`.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "ruff>=0.8",
    "usearch>=2.16",
]

# Floors for vulnerable *transitive* deps (pulled by mcp[crypto]) so the
# pip-audit CI gate stays green. Constraints only bound versions already in the
# graph — they don't add new deps. Revisit when mcp bumps these itself.
[tool.uv]
constraint-dependencies = [
    "pyjwt>=2.13.0",        # PYSEC-2026-175..179
    "cryptography>=50.0.0", # GHSA-537c-gmf6-5ccf, PYSEC-2026-3552
    "pillow>=12.3.0",       # PYSEC-2026-2253..3454, CVE-2026-54058/59198/59200/59204
]

[project.scripts]
trovex = "trovex.cli:app"

[project.urls]
Homepage = "https://trovex.dev"
Repository = "https://github.com/TsukumoHQ/trovex"
Issues = "https://github.com/TsukumoHQ/trovex/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version comes from the git tag (single source of truth): a release = `git tag vX.Y.Z`.
# local_scheme=no-local-version → PyPI-valid dev versions; fallback_version covers a
# tag-less build env. server.json is synced to the tag at publish (see publish-mcp.yml).
[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/trovex"]
# Ship the non-Python data files (Claude Code skill + hooks) `trovex setup` installs,
# plus the committed savings-benchmark result the /api/savings/benchmark route serves.
artifacts = ["src/trovex/assets/**/*", "src/trovex/_benchmark.json"]

[tool.hatch.build.targets.sdist]
only-include = ["src/trovex"]
include = [
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# E501 (long lines) is intentional. The codes below are TEMPORARY waivers for
# pre-existing debt that no CI ever enforced (there is no backend CI) — `ruff
# check` was red tree-wide on a fresh checkout. Parked here to restore a green
# trunk for the live fleet WITHOUT touching source in 9 active worktrees. They
# are to be removed (debt fixed) in the coordinated lint+format cleanup PR owned
# by cto — see relay 7b040d9c. Do not add to this list; fix new violations.
ignore = [
    "E501",
    "E702",  # multiple-statements-on-one-line (semicolon)
    "I001",  # unsorted-imports
    "N806",  # non-lowercase-variable-in-function
    "B008",  # function-call-in-default-argument
    "SIM105",  # suppressible-exception
    "UP017",  # datetime-timezone-utc
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF005",  # collection-literal-concatenation
    "RUF100",  # unused-noqa
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run the suite in parallel so it clears the gate's 900s slot cap even under
# fleet load (ticket 38c5c8a0). Tests are isolation-safe: every test gets its
# own tmp data_dir + sqlite file (no shared on-disk path, no fixed port bind,
# no module/session fixtures). worksteal balances the few long reindex tests
# (test_status_incremental, test_reindex_embed_perf) across idle workers.
#
# -n 3 (NOT auto): a FIXED, bounded worker count that matches the gate's job
# budget and leaves CPU headroom. -n auto (18 workers) saturates the cores and
# the ~1s TOOL_TIMEOUT_SEC capture-deadline tests (test_wedge_class2_recurrence
# ::test_fast_capture_is_unaffected and the other /api/capture deadline tests)
# 504 under the starvation. 3 workers keep those timings honest while still
# cutting the suite from ~300s serial to well under the cap.
addopts = "-n 3 --dist worksteal"
